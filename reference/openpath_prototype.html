<title>OpenPath Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the student's phone app on the left; teacher view, rule traces and live checks on the right. Stacks on narrow screens. */
:root{
  --bg:#f2f4f2; --surface:#ffffff; --ink:#1f2421; --muted:#56605b; --line:#c9d0cb; --tint:#eef2ef;
  --green:#1e6b52; --on-green:#ffffff; --green-tint:#ddebe4; --ochre:#94580b; --ochre-tint:#f8ebd6; --no:#7f8682;
  --font-ui:"Noto Sans Tamil","Nirmala UI","Latha","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-head:Cambria,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111513; --surface:#191f1c; --ink:#e7ece8; --muted:#a3ada7; --line:#36413b; --tint:#222a26;
    --green:#66bd98; --on-green:#0f1a15; --green-tint:#1d3a2e; --ochre:#e3a556; --ochre-tint:#3a2b16; --no:#838b86; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#111513; --surface:#191f1c; --ink:#e7ece8; --muted:#a3ada7; --line:#36413b; --tint:#222a26;
  --green:#66bd98; --on-green:#0f1a15; --green-tint:#1d3a2e; --ochre:#e3a556; --ochre-tint:#3a2b16; --no:#838b86; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.topbar h1{font-family:var(--font-head);font-size:24px;line-height:1.1;margin:0}
.topbar p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:10px;border:1px solid var(--green);background:var(--green);color:var(--on-green);font-weight:600;font-size:14px;text-align:center}
.btn.ghost{background:transparent;color:var(--green)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn svg{width:16px;height:16px;flex:none}
.card .btn{font-size:13px;padding:6px 11px;min-height:34px}
.link{background:none;border:0;padding:4px 0;color:var(--green);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.stage{display:grid;grid-template-columns:390px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.stage{grid-template-columns:minmax(0,1fr)}}

/* phone */
.phone{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:30px;height:790px;display:flex;flex-direction:column;overflow:hidden;max-width:100%}
@media (max-width:920px){.phone{height:auto;min-height:620px;border-radius:18px}}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--green)}
.brand small{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted);margin-left:4px}
.ph-tools{display:flex;align-items:center;gap:6px}
.net{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--tint);color:var(--muted);white-space:nowrap}
.net.off{background:var(--ochre-tint);color:var(--ochre);font-weight:600}
.iconbtn{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.iconbtn svg{width:16px;height:16px}
.ph-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:920px){.ph-body{overflow:visible}}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.ph-nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 10px;border:0;background:none;color:var(--muted);font-size:11.5px;line-height:1.2}
.ph-nav button svg{width:20px;height:20px}
.ph-nav button[aria-current="page"]{color:var(--green);font-weight:700}
.ph-nav .en{font-size:10px}

/* bilingual text */
.en{display:block;color:var(--muted);font-size:.84em;font-weight:400;line-height:1.3}
.lang-en .ta{display:none}
.lang-en .en{color:inherit;font-size:1em;font-weight:inherit}
.btn .en{color:inherit;opacity:.85}
.inline .en{display:inline;margin-left:4px}

/* chat */
.msg{max-width:90%;padding:10px 12px;border-radius:14px;background:var(--tint)}
.msg.me{align-self:flex-end;background:var(--green-tint)}
.qrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;gap:8px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:58px;font-size:14px}
.tile:hover{border-color:var(--green)}
.tile svg{width:28px;height:28px;flex:none;color:var(--green)}
.voice{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.mic{width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.mic svg{width:22px;height:22px}
.mic.live{outline:4px solid var(--green-tint)}

/* generic */
.stack{display:flex;flex-direction:column;gap:12px}
.center{align-items:center;text-align:center}
.h{font-family:var(--font-head);font-size:20px;line-height:1.2;margin:0}
.h3{font-size:16px;font-weight:700;margin:0;line-height:1.25}
.note{margin:0;color:var(--muted);font-size:13px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.card.chosen{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between;align-items:flex-start;flex-wrap:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink);white-space:nowrap}
.chip .en{display:inline;font-size:1em;color:inherit;margin-left:4px;font-weight:600}
.lang-en .chip .en{margin-left:0}
.chip.ok{background:var(--green-tint);color:var(--green)}
.chip.warn,.chip.wild{background:var(--ochre-tint);color:var(--ochre)}
.chip.no{background:transparent;color:var(--no);border:1px solid var(--line)}
.banner{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--green-tint);color:var(--ink);font-size:13px}
.banner svg{width:18px;height:18px;flex:none;color:var(--green);margin-top:1px}
.banner.ochre{background:var(--ochre-tint)}
.banner.ochre svg{color:var(--ochre)}
.meta{margin:0;font-size:13px;color:var(--muted)}
.why{margin:0;font-size:13px}
.story{margin:0;padding:10px 12px;border-left:3px solid var(--ochre);background:var(--tint);border-radius:0 8px 8px 0;font-size:14px}
.story small{display:block;margin-top:6px;color:var(--muted);font-size:11.5px}
.missing{margin:0;font-size:13px;color:var(--ochre);font-weight:600}
.src{margin:0;font-size:11.5px;color:var(--muted)}
.benefit{margin:0;font-size:14px}
.reason{margin:0;font-size:13px}
.group-h{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
details.group summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
details.group[open] summary{margin-bottom:8px}

/* details form */
.field{display:flex;flex-direction:column;gap:6px}
.field .label{font-size:13.5px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;line-height:1.25;text-align:left}
.seg button .en{font-size:11px}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg button[aria-pressed="true"] .en{color:var(--on-green);opacity:.85}

/* plan */
.week{display:flex;flex-direction:column;gap:6px}
.week h4{margin:0;font-size:13px;color:var(--muted);font-weight:700}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.task input{width:18px;height:18px;margin-top:2px;accent-color:var(--green);flex:none}
.task.done span{color:var(--muted);text-decoration:line-through}

/* lock screen */
.who{display:flex;flex-direction:column;gap:8px;width:100%}
.who button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--green-tint);color:var(--green);font-weight:700;flex:none}
.avatar.big{width:56px;height:56px;font-size:22px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px}
.pin{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pin svg{width:42px;height:42px}
.pin span{font-size:11px;color:var(--muted)}
.dots{display:flex;gap:10px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--green)}
.dot.on{background:var(--green)}
.warn{color:var(--ochre);font-weight:600;margin:0;font-size:13px}
.hint{margin:0;font-size:12px;color:var(--muted)}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(15,20,18,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:85%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.doc{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.doc b{font-weight:600}
.have{color:var(--green);font-weight:700;white-space:nowrap}
.need{color:var(--ochre);font-weight:700;white-space:nowrap}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 10px 0;overflow-x:auto}
.tabs button{padding:10px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green);font-weight:700}
.pbody{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pbody h2{font-family:var(--font-head);font-size:20px;margin:0}
.pbody p{margin:0}
.figs{display:flex;flex-wrap:wrap;gap:8px 20px}
.fig{display:flex;flex-direction:column}
.fig b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.fig span{font-size:12px;color:var(--muted)}
.fig.warn b{color:var(--ochre)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--tint);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.live td{background:var(--green-tint)}
td.blk{color:var(--ochre);font-weight:600}
.livetag{font-size:11px;font-weight:700;color:var(--green);margin-left:6px}
pre{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;background:var(--tint);padding:10px 12px;border-radius:10px;overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.never{font-size:13px;color:var(--muted)}
.trace{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.trace li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.mark{display:inline-block;min-width:50px;text-align:center;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--tint);color:var(--ink);flex:none}
.mark.yes{background:var(--green-tint);color:var(--green)}
.mark.no{color:var(--no);border:1px solid var(--line);background:transparent}
.mark.ask,.mark.likely,.mark.later,.mark.if{background:var(--ochre-tint);color:var(--ochre)}
code{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
details.scheme{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.scheme summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:600}
details.scheme summary .chip{font-weight:600}
.checks{display:flex;flex-direction:column;gap:10px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.check .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green);white-space:nowrap}
.check .big.bad{color:var(--ochre)}
.check p{font-size:13.5px}
.check small{grid-column:2;color:var(--muted);font-size:12px}
.cases{max-height:280px;overflow:auto}
.cases td,.cases th{font-size:12px;padding:5px 8px}
.pass{color:var(--green);font-weight:700}
.fail{color:var(--ochre);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(92vw,440px);z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion: no-preference){ .toast{animation:rise .18s ease-out} @keyframes rise{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}} }

/* plain status text instead of pills and badges */
.chip{display:inline;padding:0;border:0;border-radius:0;background:none!important;font-size:13px;font-weight:700;color:var(--ink)}
.chip.ok{color:var(--green)} .chip.warn,.chip.wild{color:var(--ochre)} .chip.no{color:var(--no);border:0}
.net{background:none;padding:0;border-radius:0;font-size:12px}
.net.off{background:none}
.group-h{text-transform:none;letter-spacing:normal;font-size:14px;color:var(--ink)}
.story{border-left:0;border-radius:8px;background:var(--tint)}
.mark{background:none!important;border:0!important;padding:0;min-width:56px;text-align:left;font-size:12px}
.livetag{font-weight:600;color:var(--green)}
.phone{border-radius:20px}
.card.chosen{box-shadow:none;border-color:var(--green);border-width:2px}

/* v3: flat surfaces, fewer borders, plainer type */
.card{border:0;background:var(--tint);border-radius:10px;padding:14px}
.card.chosen{border:0;background:var(--green-tint);outline:2px solid var(--green);outline-offset:0}
.tile{border:0;background:var(--tint);border-radius:10px}
.tile:hover{background:var(--green-tint)}
.who button{border:0;background:var(--tint);border-radius:10px}
.pin{border:0;background:var(--tint);border-radius:10px}
.seg button{border:0;background:var(--tint);border-radius:6px}
.task{border:0;background:var(--tint);border-radius:8px}
.banner{border-radius:8px}
.banner svg{display:none}
.msg{border-radius:10px}
.check{border:0;background:var(--tint);border-radius:8px}
details.scheme{border:0;background:var(--tint);border-radius:8px}
.tbl-wrap{border:0}
.panel{border:0;border-radius:12px}
.phone{border:1px solid var(--line);border-radius:16px}
.ph-top{border-bottom:0;background:var(--surface)}
.ph-nav{border-top:1px solid var(--tint)}
.btn{border-radius:8px}
.iconbtn{border:0;background:var(--tint)}
.h,.pbody h2,.topbar h1{font-family:var(--font-ui);font-weight:700;letter-spacing:normal}
.brand{font-family:var(--font-ui)}
.topbar p{display:none}
.mic{width:42px;height:42px}
</style>

<div class="wrap" id="root">
  <header class="topbar">
    <div>
      <h1>OpenPath prototype</h1>
      <p>Team 5fire, VIT Chennai. Everything below runs inside this page: the scheme rules, the paths and the checks. Go offline after it loads and it keeps working. Student data is sample data.</p>
    </div>
    <div class="actions">
      <button class="btn quiet" id="reset" data-act="reset">Reset demo</button>
    </div>
  </header>
  <div class="stage">
    <section aria-label="Student app">
      <div class="phone" id="phone">
        <div class="ph-top" id="phTop"></div>
        <div class="ph-body" id="phBody"></div>
        <nav class="ph-nav" id="phNav" aria-label="App sections"></nav>
        <div id="sheet"></div>
      </div>
    </section>
    <section class="panel" aria-label="Teacher view and checks">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pbody" id="pbody"></div>
    </section>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';

/* ---------------- network counter (proves the flow makes no calls) ---------------- */
var NET = { calls: 0 };
if (window.fetch) { var _f = window.fetch; window.fetch = function(){ NET.calls++; return _f.apply(this, arguments); }; }
if (window.XMLHttpRequest) { var _o = XMLHttpRequest.prototype.open; XMLHttpRequest.prototype.open = function(){ NET.calls++; return _o.apply(this, arguments); }; }

var CHECKED = '22 Nov 2026';
function L(ta, en){ return { ta: ta, en: en }; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function bi(x){ if (typeof x === 'string') return esc(x); return '<span class="ta">' + esc(x.ta) + '</span><span class="en">' + esc(x.en) + '</span>'; }
function joinL(list){ return L(list.map(function(x){ return x.ta; }).join(', '), list.map(function(x){ return x.en; }).join(', ')); }
function catL(a, b){ return L(a.ta + b.ta, a.en + b.en); }

/* ---------------- icons ---------------- */
var ICON = {
  ledger:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  wrench:'<path d="M14.5 4.5a4 4 0 0 0-5 5L4 15l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  care:'<circle cx="8" cy="7" r="2.5"/><circle cx="16" cy="8.5" r="2"/><path d="M3.5 19c.5-4 2.5-6 4.5-6s4 2 4.5 6M12.5 19c.4-3 1.8-4.5 3.5-4.5s3.1 1.5 3.5 4.5"/>',
  sprout:'<path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/>',
  needle:'<path d="M5 19 18 6"/><circle cx="18.5" cy="5.5" r="1.5"/><path d="M5 19c3 1 6-1 7-4s4-4 7-3"/>',
  abacus:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9h16M4 15h16"/><circle cx="8" cy="9" r="1.3"/><circle cx="11" cy="9" r="1.3"/><circle cx="14" cy="15" r="1.3"/><circle cx="17" cy="15" r="1.3"/>',
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/>',
  speech:'<path d="M4 5h16v10H9l-4 4v-4H4z"/>',
  brush:'<path d="M14 4l6 6-8 8-3-3z"/><path d="M9 15c-3 0-4 2-4 5 3 0 5-1 5-4"/>',
  hammer:'<path d="M14 6l4 4M5 19l9-9"/><path d="M12 4l3-1 6 6-1 3-3-3-2 2-3-3z"/>',

function skillsFrom(answers){
  var sk = {};
  QUESTIONS.forEach(function(q){
    var o = q.opts.filter(function(x){ return x.id === answers[q.id]; })[0];
    if (o) Object.keys(o.tags).forEach(function(k){ sk[k] = (sk[k] || 0) + o.tags[k]; });
  });
  return sk;
}
function primaryTag(p){ return Object.keys(p.tags).sort(function(a, b){ return p.tags[b] - p.tags[a]; })[0]; }
// recommend() takes the profile only so tests can prove it is ignored: gender is never read here.
function recommend(answers, profile){
  var sk = skillsFrom(answers);
  var scored = PATHS.map(function(p, i){
    var s = 0; Object.keys(p.tags).forEach(function(k){ s += p.tags[k] * (sk[k] || 0); });
    return { path:p, score:s, i:i };
  });
  var cmp = function(a, b){ return b.score - a.score || a.i - b.i; };
  scored.sort(cmp);
  var pool = scored.slice(), picks = [], usual = 0, prim = {};
  while (picks.length < 3 && pool.length) {
    var best = null, bestVal = -1e9;
    pool.forEach(function(c){
      if (c.path.usual && usual >= 1) return;
      var v = c.score - (prim[primaryTag(c.path)] ? 2 : 0);
      if (v > bestVal) { bestVal = v; best = c; }
    });
    if (!best) break;
    picks.push(best); pool.splice(pool.indexOf(best), 1);
    if (best.path.usual) usual++;
    prim[primaryTag(best.path)] = true;
  }
  if (!picks.some(function(c){ return c.path.kind !== 'degree'; })) {
    var voc = pool.filter(function(c){ return c.path.kind !== 'degree' && !c.path.usual; })[0];
    if (voc) { pool.splice(pool.indexOf(voc), 1); pool.push(picks.pop()); picks.push(voc); pool.sort(cmp); }
  }
  var wild = pool.filter(function(c){ return !c.path.usual && !prim[primaryTag(c.path)]; })[0] || pool.filter(function(c){ return !c.path.usual; })[0] || null;
  return { picks:picks, wild:wild, skills:sk };
}

function timing(when, cls){
  if (cls == null) return null;
  if (when === '9-10') return cls <= 10 ? 'now' : 'past';
  if (when === '11+') return cls >= 11 ? 'now' : 'later';
  return cls >= 13 ? 'now' : 'later';
}
function evaluate(s, p, path){
  var trace = s.checks.map(function(c){ return { c:c, r:c.fn(p, path || null) }; });
  var rs = trace.map(function(x){ return x.r; });
  var tm = timing(s.when, p.cls);
  var status;
  if (rs.indexOf(false) >= 0 || tm === 'past') status = 'no';
  else if (tm == null || rs.indexOf(null) >= 0) status = 'ask';
  else if (rs.indexOf('path') >= 0) status = 'if';
  else if (tm === 'later' || rs.indexOf('future') >= 0) status = 'later';
  else status = rs.indexOf('likely') >= 0 ? 'likely' : 'yes';
  var missing = s.docs.filter(function(d){ return !(p.docs && p.docs[d] === true); });
  return { s:s, status:status, trace:trace, timing:tm, likely:rs.indexOf('likely') >= 0, missing:missing };
}
function evaluateAll(p, path){ return SCHEMES.map(function(s){ return evaluate(s, p, path); }); }

function relevantMissing(evals){
  var seen = {}, out = [];
  evals.forEach(function(e){ if (['yes','likely','later'].indexOf(e.status) >= 0) e.missing.forEach(function(d){ if (!seen[d]) { seen[d] = 1; out.push(d); } }); });
  var order = ['bank','income','community','aadhaar'];
  return out.sort(function(a, b){ return order.indexOf(a) - order.indexOf(b); });
}

function makePlan(path, p, evals){
  var weeks = [[], [], [], []], n = 0;
  function add(w, text){ weeks[w].push({ id:'t' + (++n), text:text }); }
  add(0, L(path.name.ta + ' வேலை பற்றி DIKSHA-வில் ஒரு சிறு பாடம் பார்', 'Watch a short DIKSHA lesson about the work of a ' + path.name.en.toLowerCase()));
  add(0, L('இன்னும் இரண்டு கதைகள் கேள்','Listen to two more stories'));
  add(1, L('தினமும் 20 நிமிடம் ' + path.subject.ta + ' பயிற்சி செய் (DIKSHA)', 'Practise ' + path.subject.en + ' for 20 minutes a day (DIKSHA)'));
  relevantMissing(evals).forEach(function(d, i){ add(i < 2 ? 1 : 2, DOC_TASK[d]); });
  add(2, path.visit);
  var cls = p.cls || 10;
  if (cls <= 10 && path.after === 12 && path.group) add(3, L('பெற்றோர், ஆசிரியருடன் பேசி 11ஆம் வகுப்பில் ' + path.group.ta + ' பிரிவைத் தேர்வு செய்','Decide with your parents and teacher: ' + path.group.en + ' group in Class 11'));

  else add(3, L('பெற்றோர், ஆசிரியருடன் பேசி விண்ணப்பிக்கும் கல்லூரிகளைத் தேர்வு செய்','Choose the colleges to apply to, with your parents and teacher'));
  return weeks;
}

/* ---------------- speech (browser APIs; IndicConformer and Indic Parler-TTS replace these in the real app) ---------------- */
function speak(x){
  try {
    if (!('speechSynthesis' in window)) { toast('This browser cannot read aloud. The text is on screen.'); return; }
    var voices = window.speechSynthesis.getVoices() || [];
    var ta = voices.filter(function(v){ return /^ta/i.test(v.lang); })[0];
    var u;
    if (ta && S.lang !== 'en') { u = new SpeechSynthesisUtterance(x.ta); u.voice = ta; u.lang = ta.lang; }
    else {
      var en = voices.filter(function(v){ return /^en-IN/i.test(v.lang); })[0] || voices.filter(function(v){ return /^en/i.test(v.lang); })[0];
      u = new SpeechSynthesisUtterance(x.en); if (en) { u.voice = en; u.lang = en.lang; }
      if (S.lang !== 'en') toast('No Tamil voice on this device, so it reads in English. The app uses Indic Parler-TTS for Tamil.');
    }
    u.rate = 0.95; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  } catch (e) { toast('Could not read aloud here. The text is on screen.'); }
}
function listen(qi){
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { toast('Voice input needs Chrome with internet. Tap a picture instead.'); return; }
  try {
    var rec = new R(); rec.lang = 'ta-IN'; rec.interimResults = false; rec.maxAlternatives = 3;
    S.listening = true; render();
    rec.onresult = function(ev){
      var heard = [];
      for (var i = 0; i < ev.results[0].length; i++) heard.push(ev.results[0][i].transcript.toLowerCase());
      var q = QUESTIONS[qi], match = null;
      q.opts.forEach(function(o){ if (!match && o.kw.some(function(k){ return heard.some(function(h){ return h.indexOf(k.toLowerCase()) >= 0; }); })) match = o; });
      S.listening = false;
      if (match) { answer(q.id, match.id); toast('Heard: “' + heard[0] + '”'); }
      else { render(); toast('Heard “' + heard[0] + '”. Tap the closest picture.'); }
    };
    rec.onerror = function(ev){ S.listening = false; render(); toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'The microphone is blocked here. Tap a picture instead.' : 'Could not hear that. Tap a picture instead.'); };
    rec.onend = function(){ if (S.listening) { S.listening = false; render(); } };
    rec.start();
  } catch (e) { S.listening = false; render(); toast('Voice input is not available here. Tap a picture instead.'); }
}

/* ---------------- actions ---------------- */
function answer(qid, oid){ S.answers[qid] = oid; render(); }
function choosePath(id){
  S.path = id; var path = PATH[id];
  S.plan = makePlan(path, S.profile, evaluateAll(S.profile, path)); S.done = {};
  S.screen = 'plan'; render(); toast('Plan ready for ' + path.name.en + '.');
}
function reroute(){
  if (!S.plan) return;
  for (var w = 0; w < 4; w++) {
    var open = S.plan[w].filter(function(t){ return !S.done[t.id]; });
    if (open.length) {
      if (w === 3) { toast('This is the last week. We will remind you again in 3 days.'); return; }
      S.plan[w] = S.plan[w].filter(function(t){ return S.done[t.id]; });
      S.plan[w + 1] = open.concat(S.plan[w + 1]);
      render(); toast('Plan updated: ' + open.length + ' step' + (open.length > 1 ? 's' : '') + ' moved to week ' + (w + 2) + '.'); return;
    }
  }
  toast('Every step is done.');
}
function syncPayload(){
  var path = currentPath(), evals = evaluateAll(S.profile, path), miss = relevantMissing(evals);
  var all = S.plan ? [].concat.apply([], S.plan) : [], done = all.filter(function(t){ return S.done[t.id]; }).length;
  var step = qIndex() < QUESTIONS.length ? 'discover' : !path ? 'paths' : 'plan';
  var blocker = !path ? 'no_path_yet' : miss[0] === 'bank' ? 'bank_account_aadhaar' : miss[0] ? miss[0] + '_certificate' : null;
  if (miss[0] === 'aadhaar') blocker = 'aadhaar';
  return { student:'10B-07', step:step, path:path ? path.id : null, plan_done:S.plan ? done + '/' + all.length : null, blocker:blocker, synced_at:new Date().toISOString().slice(0, 16) + 'Z' };
}

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(r, arr){ return arr[Math.floor(r() * arr.length)]; }
function randomProfile(r){
  return { gender:pick(r, ['girl','boy','third']), cls:pick(r, [9,10,11,12,13]), school:pick(r, ['govt','aided','private']), since6:r() < 0.7, medium:pick(r, ['tamil','english']),
    community:pick(r, ['SC','ST','BC','MBC','DNC','OC','NA']), income:pick(r, ['lt1','1to2.5','2.5to4.5','4.5to8','gt8','unknown']), firstGen:pick(r, [true,false,'unknown']), top20:pick(r, [true,false,null]),
    docs:{ aadhaar:r() < 0.9, bank:r() < 0.6, income:r() < 0.5, community:r() < 0.6 } };
}
function randomAnswers(r){ var a = {}; QUESTIONS.forEach(function(q){ a[q.id] = pick(r, q.opts).id; }); return a; }
function runChecks(){
  var results = CASES.map(function(c){ var got = evaluate(SCHEME[c[0]], c[2], c[3] ? PATH[c[3]] : null).status; return { scheme:SCHEME[c[0]].name.en, name:c[1], expect:c[4], got:got, pass:got === c[4] }; });
  var passed = results.filter(function(x){ return x.pass; }).length;
  var r = rng(2026), N = 1000, changed = 0;
  for (var i = 0; i < N; i++) {
    var a = randomAnswers(r), p1 = randomProfile(r), p2 = clone(p1);
    p2.gender = p1.gender === 'girl' ? 'boy' : 'girl';
    var ids = function(rec){ return rec.picks.map(function(c){ return c.path.id; }).concat(rec.wild ? [rec.wild.path.id] : []).join(','); };
    if (ids(recommend(a, p1)) !== ids(recommend(a, p2))) changed++;
  }
  var r2 = rng(7), M = 10000, profiles = [];
  for (var j = 0; j < M; j++) profiles.push([randomProfile(r2), pick(r2, PATHS.concat([null]))]);
  var t0 = performance.now();
  for (var k = 0; k < M; k++) evaluateAll(profiles[k][0], profiles[k][1]);
  var ms = performance.now() - t0;
  var before = NET.calls;
  var flow = recommend(KAVYA.answers, KAVYA.profile), chosen = flow.picks[0].path, ev = evaluateAll(KAVYA.profile, chosen);
  makePlan(chosen, KAVYA.profile, ev); relevantMissing(ev); evaluateAll(KAVYA.profile, null);
  var calls = NET.calls - before;
  var kb = Math.round(new Blob([document.documentElement.outerHTML]).size / 1024);
  S.tests = { results:results, passed:passed, total:results.length, N:N, changed:changed, M:M, ms:ms, perMs:ms / M, calls:calls, kb:kb, schemes:SCHEMES.length, paths:PATHS.length, rules:SCHEMES.reduce(function(a, s){ return a + s.checks.length; }, 0) };
  window.OPENPATH_CHECKS = { passed:passed, total:results.length, genderSwapChanged:changed, genderSwapN:N, evalMsTotal:+ms.toFixed(1), evalProfiles:M, networkCallsInFlow:calls, pageKB:kb, schemes:SCHEMES.length, paths:PATHS.length, ruleChecks:S.tests.rules };
}
function panelChecks(){
  if (!S.tests) runChecks();
  var t = S.tests;
  return '<h2>Checks</h2><p class="note">These run in your browser each time the page opens. Nothing here is typed in by hand.</p><div class="checks">' +
    '<div class="check"><span class="big ' + (t.passed === t.total ? '' : 'bad') + '">' + t.passed + '/' + t.total + '</span><p>rule tests pass. Each case was written from the scheme criteria in the linked sources.</p><small>' + t.schemes + ' schemes, ' + t.rules + ' rule checks, each with a source and check date.</small></div>' +
    '<div class="check"><span class="big ' + (t.changed ? 'bad' : '') + '">' + t.changed + '</span><p>of ' + t.N.toLocaleString('en-IN') + ' random students got different paths when only their gender was flipped.</p><small>Path matching never reads gender. This test fails if anyone adds it.</small></div>' +
    '<div class="check"><span class="big">' + (t.ms < 1000 ? Math.round(t.ms) + ' ms' : (t.ms / 1000).toFixed(1) + ' s') + '</span><p>to check all ' + t.schemes + ' schemes for ' + t.M.toLocaleString('en-IN') + ' random students on this device.</p><small>About ' + (t.perMs * 1000).toFixed(0) + ' microseconds per student, with no server.</small></div>' +
    '<div class="check"><span class="big">' + t.calls + '</span><p>network calls during a full student flow: discover, paths, plan and eligibility.</p><small>Go offline in DevTools and use the phone on the left: it keeps working.</small></div>' +
    '<div class="check"><span class="big">' + t.kb + ' KB</span><p>for the whole prototype: rules, ' + t.paths + ' paths, both languages and these tests.</p><small>Small enough to share phone to phone.</small></div>' +
    '</div><button class="btn quiet" data-act="rerun">Run the checks again</button>' +
    '<details class="group"><summary>See all ' + t.total + ' rule tests</summary><div class="tbl-wrap cases"><table><thead><tr><th>Scheme</th><th>Case</th><th>Expected</th><th>Got</th><th></th></tr></thead><tbody>' +
    t.results.map(function(x){ return '<tr><td>' + esc(x.scheme) + '</td><td>' + esc(x.name) + '</td><td>' + x.expect + '</td><td>' + x.got + '</td><td class="' + (x.pass ? 'pass' : 'fail') + '">' + (x.pass ? 'pass' : 'FAIL') + '</td></tr>'; }).join('') +
    '</tbody></table></div></details>';
}

  document.getElementById('pbody').innerHTML = { teacher:panelTeacher, rules:panelRules, checks:panelChecks }[S.panel]();
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'close-sheet' && ev.target.closest('[data-stop]') && !ev.target.closest('button')) return;
  var a = el.dataset.act;
  if (a === 'who') {
    if (el.dataset.id === 'new') { S.who = 'new'; S.user = 'New student'; S.userTa = null; S.answers = {}; S.profile = blankProfile(); S.path = null; S.plan = null; go('discover'); return; }
    S.who = el.dataset.id; S.pin = []; S.pinMsg = null; render(); return;
  }
  if (a === 'who-back') { S.who = null; S.pin = []; S.pinMsg = null; render(); return; }
  if (a === 'pin') {
    S.pin.push(el.dataset.id); S.pinMsg = null;
    if (S.pin.length === 3) {
      var ok = PIN_CODE[S.who] && PIN_CODE[S.who].join() === S.pin.join();
      if (!ok) { S.pin = []; S.pinMsg = L('சரியில்லை. மீண்டும் முயற்சி செய்.','Not quite. Try again.'); render(); return; }
      if (S.who === 'anbu') { S.who = null; S.pin = []; render(); toast('Anbu’s profile opened. Kavya’s answers stay hidden from him. For this demo, use Kavya.'); return; }
      S.user = 'Kavya'; S.userTa = 'காவ்யா'; S.answers = {}; S.profile = blankProfile(); S.path = null; S.plan = null; S.done = {}; S.pin = [];
      go('discover'); return;
    }
    render(); return;
  }
  if (a === 'lock') { S.screen = 'lock'; S.who = null; S.pin = []; render(); return; }
  if (a === 'lang') { S.lang = S.lang === 'en' ? 'bi' : 'en'; render(); return; }
  if (a === 'ans') { answer(el.dataset.q, el.dataset.o); return; }
  if (a === 'say') { speak(QUESTIONS[+el.dataset.q].q); return; }
  if (a === 'mic') { listen(+el.dataset.q); return; }
  if (a === 'sample-answers') { S.answers = clone(KAVYA.answers); render(); return; }
  if (a === 'sample-profile') { S.profile = clone(KAVYA.profile); render(); return; }
  if (a === 'set') {
    var v = JSON.parse(el.dataset.v), k = el.dataset.k;
    S.profile[k] = S.profile[k] === v ? null : v;
    if (S.path) S.plan = makePlan(currentPath(), S.profile, evaluateAll(S.profile, currentPath()));
    render(); return;
  }
  if (a === 'doc') { var d = el.dataset.d; S.profile.docs[d] = S.profile.docs[d] === true ? false : true; render(); return; }
  if (a === 'go') { go(el.dataset.s); return; }
  if (a === 'redo') { S.answers = {}; go('discover'); return; }
  if (a === 'story') { var id = el.dataset.id; S.story = S.story === id ? null : id; render(); if (S.story) speak(PATH[id].story); return; }
  if (a === 'choose') { choosePath(el.dataset.id); return; }
  if (a === 'reroute') { reroute(); return; }
  if (a === 'ready') { S.sheet = el.dataset.id; render(); return; }
  if (a === 'close-sheet') { S.sheet = null; render(); return; }
  if (a === 'panel') { S.panel = el.dataset.id; render(); return; }
  if (a === 'rerun') { runChecks(); render(); toast('Checks ran again.'); return; }
  if (a === 'reset') { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} S = freshState(); render(); toast('Demo reset.'); return; }
});

  var el = ev.target; if (el.dataset && el.dataset.act === 'task') { S.done[el.dataset.id] = el.checked; render(); }
});
